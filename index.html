<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="다음 접속 때 헤매지 않도록. 지난 플레이와 다음 목표를 내 기기에만 기록하는 게임 노트."><title>다음 플레이 · hmdev</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"></head><body><a class="skip" href="#main">본문으로</a><header><a class="wordmark" href="/"><span class="mark">h.</span>다음 플레이</a><span class="beta">BETA</span></header><main id="main"><section class="hero"><p class="eyebrow">PICK UP WHERE YOU LEFT OFF</p><h1>지난번에,<br><em>뭐 하려고 했더라?</em></h1><p class="lead">다음 접속을 위한 짧은 메모.<br>게임의 이야기는 덜어내고, 나의 플레이만 남겨요.</p></section><div class="row"><label for="profiles" class="sr-only">게임 프로필</label><select id="profiles" aria-label="게임 프로필"></select><button class="secondary" id="new-profile">+ 게임 추가</button></div><section id="editor"></section><div class="actions"><button class="secondary" id="export">백업 내보내기</button><button class="secondary" id="import">백업 복원</button></div><input type="file" accept="application/json,.json" id="backup" hidden><details><summary>저장과 개인정보 안내</summary><p>모든 기록은 이 브라우저에만 저장하며 서버로 보내지 않습니다. 기기나 브라우저를 바꾸면 기록이 보이지 않아요. 브라우저 데이터 삭제에 대비해 백업을 보관해주세요. 광고와 방문 분석은 연결하지 않았습니다.</p></details><p id="status" role="status" aria-live="polite"></p></main><footer><a href="https://hmdev-hub.vercel.app/">만든 사람 · <b>hmdev</b> ↗</a><span>내 기기에만 남는 플레이 기록</span></footer><dialog id="create"><form id="create-form"><h2>어떤 게임을 기록할까요?</h2><label for="game-title">게임명</label><input id="game-title" maxlength="60" required placeholder="예: 지금 플레이하는 게임"><label for="profile-label">세이브 이름 (선택)</label><input id="profile-label" maxlength="40" placeholder="예: 첫 번째 플레이"><div class="actions"><button type="button" class="secondary" id="cancel-create">취소</button><button class="primary">만들기</button></div></form></dialog><script type="module" src="/app.js"></script></body></html>
