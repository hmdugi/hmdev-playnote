<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임메모 지도 이미지 안내</title><link rel="stylesheet" href="/style.css"></head><body><main><a href="/">← 게임메모</a><h1>내 게임 지도로 기록하세요</h1><p>GTA5·엘든 링·스타듀 밸리를 선택하면 게임별 표식 이름을 사용할 수 있습니다. 이들 게임의 기본 지도 이미지와 공식 아이콘은 포함하지 않습니다. 표식은 게임메모의 공통 기호를 사용합니다.</p><p>직접 가진 지도 이미지나 본인이 이용 가능한 이미지를 가져와 사용하세요. 이미지와 메모는 브라우저 안에서만 처리하며 공개 공유하지 않습니다.</p><p>기존에 저장한 지도와 표식은 그대로 남아 있습니다. 이전 오픈소스 게임 자료는 기본 선택 목록에서 제외했습니다.</p><a href="/maps/legacy-credits.html">이전 예제 자료의 출처·라이선스</a></main></body></html>
